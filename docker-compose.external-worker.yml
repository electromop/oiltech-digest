# Зарубежный контур (NL): две полосы вместо одного воркера.
#
# До 18.09 один контейнер слушал все три очереди и брал задачи по одной, строго по
# времени создания: 30 пакетов ИИ-пересчёта (по ~10 мин) держали за собой 42 задачи
# сбора, и западные источники не собирались часами. Выдача задач идёт через
# FOR UPDATE SKIP LOCKED, поэтому два воркера одну задачу не получат никогда.
#
# Второй ИИ-воркер сюда НЕ добавлять, пока нет резерва статей при выдаче: обычный пакет
# process_articles выбирает «статьи без обработки» в момент выдачи, и два воркера,
# взявшие задачи с разницей в секунду, оплатили бы одни и те же статьи дважды.
services:
  # ИИ: пакеты статей, перепроверка релевантности, перевод, документы, судья перепечаток.
  external-worker:
    build: .
    container_name: oiltech_external_worker
    restart: unless-stopped
    env_file:
      - .env.external-worker
    environment:
      PYTHONUNBUFFERED: "1"
      EXTERNAL_WORKER_ID: nl-ai-1
      EXTERNAL_WORKER_QUEUES: external-ai
      EXTERNAL_WORKER_CAPABILITIES: openai
    command: ["python", "-m", "oiltech_digest.cli", "-v", "external-worker"]

  # Сбор: источники запросом и браузером, дозагрузка тел статей. ИИ не зовёт.
  external-worker-fetch:
    build: .
    container_name: oiltech_external_worker_fetch
    restart: unless-stopped
    env_file:
      - .env.external-worker
    environment:
      PYTHONUNBUFFERED: "1"
      EXTERNAL_WORKER_ID: nl-fetch-1
      EXTERNAL_WORKER_QUEUES: external-fetch,external-playwright
      EXTERNAL_WORKER_CAPABILITIES: http_fetch,playwright
    command: ["python", "-m", "oiltech_digest.cli", "-v", "external-worker"]
